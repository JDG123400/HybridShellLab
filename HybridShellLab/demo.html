<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Shell Lab 演示页</title>
<style>
  body { font-family: -apple-system, sans-serif; text-align: center; padding-top: 60px; background: #f6f7fb; }
  h1 { color: #111827; }
  #score { font-size: 64px; font-weight: 800; color: #3b82f6; margin: 12px 0; }
  #tap { font-size: 22px; padding: 16px 48px; border: 0; border-radius: 16px; background: #3b82f6; color: #fff; }
  #tap:active { transform: scale(.97); }
  #rate { color: #6b7280; margin-top: 14px; }
  .note { margin: 28px 16px; font-size: 12px; color: #9ca3af; }
</style>
</head>
<body>
  <h1>🐟 点击小游戏</h1>
  <div id="score">0</div>
  <button id="tap">点击 +1</button>
  <div id="rate">倍率: x1</div>
  <div class="note">此页面打包在 App 内 (demo.html), 注入脚本只作用于你自己拥有的页面。</div>
<script>
window.game = {
  score: 0,
  speed: 1,
  click: function () { this.score += this.speed; render(); },
  setSpeed: function (n) { this.speed = n; render(); },
  getScore: function () { return Math.floor(this.score); }
};
setInterval(function () { window.game.score += window.game.speed; render(); }, 1000);
function render() {
  document.getElementById('score').textContent = window.game.getScore();
  document.getElementById('rate').textContent = '倍率: x' + window.game.speed;
}
document.getElementById('tap').addEventListener('click', function () { window.game.click(); });
render();
</script>
</body>
</html>
